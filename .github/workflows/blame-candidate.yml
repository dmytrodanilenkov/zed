name: Blame candidate
on:
  push:
    branches: ['ci/blame-66953-d3f44e4f']
permissions:
  contents: read
jobs:
  blame:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 160
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Check Git encoding alias and both BOM converters
        shell: python
        run: |
          import subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=d)
              git('init', '-q')
              p = Path(d)
              (p/'.gitattributes').write_text('f text eol=lf working-tree-encoding=UTF-8//IGNORE diff=bom\n')
              data = 'first café\nmiddle\nlast déjà\n'.encode('utf-8-sig')
              (p/'f').write_bytes(data)
              git('add', '.')
              git('-c','user.name=Test','-c','user.email=test@example.invalid','commit','-qm','fixture')
              for cmd, expected in [('cat',data), ("sed '1s/^\ufeff//'", data[3:])]:
                  git('config','diff.bom.textconv',cmd)
                  assert git('cat-file','--textconv',':f') == expected, cmd
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./script/linux
      - name: Run Git and file-content unit tests
        run: cargo test --locked -p file_content -p git --lib
      - name: Run project blame integration tests
        run: cargo test --locked -p project --features test-support --test integration test_blame_buffer_ -- --test-threads=1
